<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpeakUp — Sessions</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<nav>
  <a href="index.html" class="nav-brand">SpeakUp</a>
  <div class="nav-links">
    <a href="index.html">Practice</a>
    <a href="dashboard.html" class="active">Sessions</a>
    <a href="settings.html">Settings</a>
  </div>
</nav>

<main>
  <h1 id="dashHeading">Your Sessions</h1>
  <p id="dashSub" style="color:var(--text2);margin-bottom:24px;">All past practice sessions stored in your browser.</p>

  <!-- SUMMARY STRIP -->
  <div class="card card-sm" style="margin-bottom:24px;">
    <div class="analytics-grid" style="grid-template-columns:repeat(4,1fr);">
      <div class="stat-box">
        <div class="stat-value" id="totalSessions">—</div>
        <div class="stat-label">Sessions</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="totalMinutes">—</div>
        <div class="stat-label">Minutes</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="avgSpeakRatio">—</div>
        <div class="stat-label">Avg Speak %</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="bestStreak">—</div>
        <div class="stat-label">Best Streak</div>
      </div>
    </div>
  </div>

  <!-- FILTER -->
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;">
    <h2 style="margin:0;font-size:22px;">All Recordings</h2>
    <div style="display:flex;gap:8px;align-items:center;">
      <button class="btn btn-ghost" style="padding:8px 16px;font-size:14px;" onclick="sortBy('date')">
        Sort by Date
      </button>
      <button class="btn btn-ghost" style="padding:8px 16px;font-size:14px;" onclick="sortBy('speak')">
        Sort by Speak Time
      </button>
      <button class="btn btn-danger" style="padding:8px 16px;font-size:14px;" onclick="clearAll()">
        Clear All
      </button>
    </div>
  </div>

  <!-- SESSION LIST -->
  <div id="sessionList"></div>

</main>

<div class="toast" id="toast"></div>
<script src="dashboard.js"></script>
</body>
</html>
